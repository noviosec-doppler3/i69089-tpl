projects:
  - name: 'i69089-edgea1'
    description: 'anchors binary timestamp'
    environments:
      - name: 'E'
        slug: 'edge'
        configs:
          - slug: 'edge'
    secrets:
      edge:
        ANCHORED: &anc 'anchval'
        ALIASED: *anc
        BIN: !!binary "aGVsbG8="
        TS: !!timestamp '2026-01-01T00:00:00Z'
